<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Body Fetcher</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    #emailBody {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Fetch Netflix Email</h2>
    <input type="email" id="emailInput" placeholder="Enter your email">
    <button onclick="fetchLatestEmail()">Fetch Latest Email</button>
    <div id="emailBody"></div>
  </div>

  <script>
    async function fetchLatestEmail() {
      const email = document.getElementById("emailInput").value;
      if (!email) {
        alert("Please enter your email!");
        return;
      }

      const response = await fetch("http://localhost:3000/fetch-latest-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });

      const data = await response.json();
      const emailBodyDiv = document.getElementById("emailBody");
      emailBodyDiv.innerHTML = "";

      if (data.error) {
        emailBodyDiv.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
      } else {
        emailBodyDiv.innerHTML = data.body || '<p>No content available</p>';
      }
    }
  </script>
</body>
</html>
