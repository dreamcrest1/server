<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Body Fetcher</title>
  <style>
    /* General Styling */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 450px;
      background: #2a2a2a;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
      text-align: center;
      color: white;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    /* Input & Button */
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ff4c4c;
      background: #333;
      color: white;
      font-size: 16px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #ff1a1a;
      box-shadow: 0 0 5px rgba(255, 26, 26, 0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      background-color: #ff1a1a;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #e60000;
      transform: scale(1.05);
    }

    /* Email Display Box */
    #emailBox {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
      margin-top: 20px;
      width: 100%;
      word-wrap: break-word;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      border-left: 4px solid #ff4c4c;
      transition: all 0.5s ease-in-out;
      opacity: 0;
      color: white !important;  /* ✅ Forces visible text */
      filter: brightness(100%) contrast(100%); /* ✅ Ensures visibility */
    }

    #emailBox.show {
      opacity: 1;
    }

    #emailBox * {
      color: white !important; /* ✅ Ensures all text inside is visible */
    }

    /* Loader Animation */
    .loader {
      display: none;
      border: 5px solid #333;
      border-top: 5px solid #ff1a1a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .container {
        max-width: 95%;
      }

      input, button {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📩 Fetch Netflix Email</h2>

    <!-- Input Section -->
    <div id="inputSection">
      <input type="email" id="emailInput" placeholder="Enter your email">
      <button onclick="fetchLatestEmail()">Fetch Latest Email</button>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader"></div>

    <!-- Email Display Box -->
    <div id="emailBox"></div>
  </div>

  <script>
    async function fetchLatestEmail() {
      const email = document.getElementById("emailInput").value;
      const emailBox = document.getElementById("emailBox");
      const loader = document.getElementById("loader");

      if (!email) {
        alert("Please enter your email!");
        return;
      }

      // Show loader and clear previous email content
      loader.style.display = "block";
      emailBox.style.opacity = "0";
      emailBox.innerHTML = "";

      try {
        const response = await fetch("/fetch-latest-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        // Hide loader
        loader.style.display = "none";

        if (data.error) {
          emailBox.innerHTML = `<p style="color: red; font-weight: bold;">⚠️ Error: ${data.error}</p>`;
        } else {
          emailBox.innerHTML = `
            <h3>📧 Latest Netflix Email:</h3>
            <div style="color: white; background: #1e1e1e; padding: 10px; border-radius: 8px;">
              ${data.body || '<p style="color: red;">No content available</p>'}
            </div>
          `;
        }

        // Show the email box with animation
        emailBox.classList.add("show");
      } catch (error) {
        loader.style.display = "none";
        emailBox.innerHTML = `<p style="color: red;">❌ Failed to fetch email.</p>`;
      }
    }
  </script>

</body>
</html>
