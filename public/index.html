<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Fetcher</title>
    <style>
        body { font-family: Arial, sans-serif; }
        input, button { padding: 10px; margin: 5px; }
        .email-container { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>

    <h2>Enter Your Email</h2>
    <input type="email" id="emailInput" placeholder="your-email@dreamcrest.net">
    <button onclick="fetchEmails()">Fetch Emails</button>

    <div id="emails"></div>

    <script>
        async function fetchEmails() {
            const email = document.getElementById("emailInput").value;
            if (!email) return alert("Please enter your email!");

            const response = await fetch("http://localhost:3000/fetch-emails", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
            });

            const data = await response.json();
            const emailContainer = document.getElementById("emails");
            emailContainer.innerHTML = "";

            if (data.error) {
                emailContainer.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
                return;
            }

            data.emails.forEach(email => {
                emailContainer.innerHTML += `
                    <div class="email-container">
                        <h3>${email.subject}</h3>
                        <p><b>From:</b> ${email.from}</p>
                        <p><b>Date:</b> ${email.date}</p>
                        <p>${email.body}</p>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
