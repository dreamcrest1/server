<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Email Fetcher</title>
  <style>
    :root {
      --primary-red: #E50914;
      --dark-red: #B20710;
      --black: #221F1F;
      --white: #F5F5F1;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #2a2a2a 0%, #000 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
    }

    .container {
      background: rgba(0, 0, 0, 0.85);
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    h2 {
      color: var(--white);
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    input {
      width: 100%;
      padding: 1rem;
      margin: 1rem 0;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 2px var(--primary-red);
    }

    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
      color: var(--white);
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #emailBox {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(229, 9, 20, 0.3);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 2rem;
      color: var(--white);
      line-height: 1.6;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(229, 9, 20, 0.2);
      border-top: 4px solid var(--primary-red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .email-content {
      font-family: monospace;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.5);
      padding: 1rem;
      border-radius: 5px;
      overflow-x: auto;
    }

    /* Netflix-style pulsating animation */
    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    .netflix-pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
        margin: 1rem;
      }
      
      h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container netflix-pulse">
    <h2>🎬 Netflix Email Fetcher</h2>
    <input type="email" id="emailInput" placeholder="Enter your Netflix email" autocomplete="off">
    <button onclick="fetchLatestEmail()">
      <span class="button-text">Fetch Latest Email</span>
    </button>

    <div class="loader" id="loader"></div>
    <div id="emailBox"></div>
  </div>

  <script>
    // JavaScript remains the same as previous version
    // ... [existing JavaScript code] ...
  </script>
</body>
</html>
