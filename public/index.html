<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Fetcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      background: white;
      padding: 20px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: red;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #emailBox {
      display: none;
      background: #fff;
      padding: 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 10px;
      text-align: left;
      overflow: hidden;
      max-width: 100%;
    }

    .email-header {
      padding: 10px;
      background: red;
      color: white;
      border-radius: 5px 5px 0 0;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      margin: 0;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      margin: 0;
      padding: 0;
    }

    .loader {
      display: none;
      margin: 10px auto;
      border: 4px solid #ccc;
      border-top: 4px solid red;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Fetch Netflix Email</h2>
    <input type="email" id="emailInput" placeholder="Enter your email">
    <button onclick="fetchLatestEmail()">Fetch Latest Email</button>

    <div class="loader" id="loader"></div>

    <div id="emailBox">
      <div class="email-header">📧 Latest Netflix Email</div>
      <iframe id="emailFrame"></iframe>
    </div>
  </div>

  <script>
    async function fetchLatestEmail() {
      const email = document.getElementById("emailInput").value;
      const emailBox = document.getElementById("emailBox");
      const emailFrame = document.getElementById("emailFrame");
      const loader = document.getElementById("loader");

      if (!email) {
        alert("Please enter your email!");
        return;
      }

      // Show loader
      loader.style.display = "block";
      emailBox.style.display = "none";

      try {
        const response = await fetch("/fetch-latest-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();
        console.log("Fetched Email Content:", data.body); // Debugging Log

        // Hide loader
        loader.style.display = "none";

        if (data.error) {
          emailFrame.srcdoc = `<p style="color: red; text-align: center; font-weight: bold;">⚠️ Error: ${data.error}</p>`;
        } else {
          emailFrame.srcdoc = data.body || '<p style="color: red;">No content available</p>';
        }

        // Show email box
        emailBox.style.display = "block";

      } catch (error) {
        loader.style.display = "none";
        emailFrame.srcdoc = `<p style="color: red; text-align: center;">❌ Failed to fetch email.</p>`;
      }
    }
  </script>

</body>
</html>
