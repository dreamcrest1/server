<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Fetcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      background: white;
      padding: 20px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: red;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #emailBox {
      display: none;
      background: #fff;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 10px;
      text-align: left;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-x: hidden;
      max-width: 100%;
    }

    #emailContent {
      padding: 5px;
      border-radius: 5px;
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
      background-color: #f9f9f9;
      color: #333;
    }

    .loader {
      display: none;
      margin: 10px auto;
      border: 4px solid #ccc;
      border-top: 4px solid red;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Fetch Netflix Email</h2>
    <input type="email" id="emailInput" placeholder="Enter your email">
    <button onclick="fetchLatestEmail()">Fetch Latest Email</button>

    <div class="loader" id="loader"></div>

    <div id="emailBox">
      <h3 style="margin-bottom: 5px;">📧 Latest Netflix Email:</h3>
      <div id="emailContent"></div>
    </div>
  </div>

  <script>
    async function fetchLatestEmail() {
      const email = document.getElementById("emailInput").value;
      const emailBox = document.getElementById("emailBox");
      const emailContent = document.getElementById("emailContent");
      const loader = document.getElementById("loader");

      if (!email) {
        alert("Please enter your email!");
        return;
      }

      // Show loader
      loader.style.display = "block";
      emailBox.style.display = "none";
      emailContent.innerHTML = "";

      try {
        const response = await fetch("/fetch-latest-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();
        console.log("Fetched Email Content:", data.body); // Debugging Log

        // Hide loader
        loader.style.display = "none";

        if (data.error) {
          emailContent.innerHTML = `<p style="color: red; font-weight: bold;">⚠️ Error: ${data.error}</p>`;
        } else {
          emailContent.innerHTML = `
            <div>${data.body || '<p style="color: red;">No content available</p>'}</div>
          `;
        }

        // Show email box
        emailBox.style.display = "block";

        // Ensure all text is visible
        setTimeout(() => {
          emailContent.querySelectorAll('[style*="display: none"]').forEach(el => {
            el.style.display = "block";
          });

          emailContent.querySelectorAll('*').forEach(el => {
            el.style.color = "#333";
            el.style.backgroundColor = "transparent";
            el.style.visibility = "visible";
          });

          console.log("✅ Forced Visibility Applied");
        }, 500);

      } catch (error) {
        loader.style.display = "none";
        emailContent.innerHTML = `<p style="color: red;">❌ Failed to fetch email.</p>`;
      }
    }
  </script>

</body>
</html>
