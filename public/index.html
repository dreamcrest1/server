<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Body Fetcher</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .hidden {
      display: none;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #emailBox {
      display: none; /* Hidden initially */
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
      width: 100%;
      word-wrap: break-word;
      text-align: left;
      max-height: 400px;
      overflow-y: auto; /* Enables scrolling if content is large */
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .container {
        max-width: 90%;
      }

      input, button {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Fetch Netflix Email</h2>

    <!-- Input Section (Will Now Stay Visible) -->
    <div id="inputSection">
      <input type="email" id="emailInput" placeholder="Enter your email">
      <button onclick="fetchLatestEmail()">Fetch Latest Email</button>
    </div>

    <!-- Email Display Box -->
    <div id="emailBox"></div>
  </div>

  <script>
    async function fetchLatestEmail() {
      const email = document.getElementById("emailInput").value;
      const emailBox = document.getElementById("emailBox");

      if (!email) {
        alert("Please enter your email!");
        return;
      }

      // Fetch email data
      const response = await fetch("/fetch-latest-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });

      const data = await response.json();

      if (data.error) {
        alert(`Error: ${data.error}`);
      } else {
        // Show email content but KEEP input section visible
        emailBox.style.display = "block";
        emailBox.innerHTML = ` 
          <h3>📧 Latest Netflix Email:</h3>
          <p>${data.body || 'No content available'}</p>
        `;
      }
    }
  </script>
</body>
</html>
