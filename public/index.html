<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Fetcher</title>
  <style>
    /* General Page Styling */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #141414;
      text-align: center;
      margin: 0;
      padding: 20px;
      color: white;
    }

    /* Main Container */
    .container {
      max-width: 500px;
      background: #1f1f1f;
      padding: 20px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-in-out;
    }

    /* Input & Button Styling */
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ff4c4c;
      font-size: 16px;
      transition: all 0.3s ease-in-out;
    }

    input {
      background: #333;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #ff1a1a;
      box-shadow: 0 0 8px rgba(255, 26, 26, 0.8);
    }

    button {
      background-color: #ff1a1a;
      color: white;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      border: none;
      transition: background 0.3s ease-in-out, transform 0.2s;
    }

    button:hover {
      background-color: #e60000;
      transform: scale(1.05);
    }

    /* Email Display Box */
    #emailBox {
      display: none;
      background: #1a1a1a;
      border-radius: 10px;
      border: 2px solid #ff4c4c;
      margin-top: 15px;
      text-align: left;
      overflow: hidden;
      max-width: 100%;
      animation: fadeIn 0.5s ease-in-out;
    }

    /* Email Header */
    .email-header {
      padding: 12px;
      background: #ff1a1a;
      color: white;
      border-radius: 10px 10px 0 0;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    /* Email Content Iframe */
    iframe {
      width: 100%;
      height: 400px;
      border: none;
      background: white;
    }

    /* Loader Animation */
    .loader {
      display: none;
      margin: 15px auto;
      border: 6px solid #333;
      border-top: 6px solid red;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    /* Animations */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .container {
        max-width: 90%;
      }

      input, button {
        font-size: 14px;
      }

      iframe {
        height: 350px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="color: #ff1a1a;">📩 Fetch Netflix Email</h2>
    <input type="email" id="emailInput" placeholder="Enter your email">
    <button onclick="fetchLatestEmail()">Fetch Latest Email</button>

    <div class="loader" id="loader"></div>

    <div id="emailBox">
      <div class="email-header">📧 Latest Netflix Email</div>
      <iframe id="emailFrame"></iframe>
    </div>
  </div>

  <script>
    async function fetchLatestEmail() {
      const email = document.getElementById("emailInput").value;
      const emailBox = document.getElementById("emailBox");
      const emailFrame = document.getElementById("emailFrame");
      const loader = document.getElementById("loader");

      if (!email) {
        alert("Please enter your email!");
        return;
      }

      // Show loader
      loader.style.display = "block";
      emailBox.style.display = "none";

      try {
        const response = await fetch("/fetch-latest-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();
        console.log("Fetched Email Content:", data.body); // Debugging Log

        // Hide loader
        loader.style.display = "none";

        if (data.error) {
          emailFrame.srcdoc = `<p style="color: red; text-align: center; font-weight: bold;">⚠️ Error: ${data.error}</p>`;
        } else {
          emailFrame.srcdoc = data.body || '<p style="color: red;">No content available</p>';
        }

        // Show email box
        emailBox.style.display = "block";

      } catch (error) {
        loader.style.display = "none";
        emailFrame.srcdoc = `<p style="color: red; text-align: center;">❌ Failed to fetch email.</p>`;
      }
    }
  </script>

</body>
</html>
